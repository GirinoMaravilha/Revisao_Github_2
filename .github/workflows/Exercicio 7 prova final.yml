# Exercicio 7
name: Exercicio 7

on:
  pull_request:
      branches: [main]

jobs:
  linting:
    runs-on: ubuntu-latest
    permissions: read-all
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10','3.11','3.13']
    steps:
      - name: Upando commit para o runner
        uses: actions/checkout@v6.0.2

      - name: Configurando ambiente python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{matrix.python-version}}

      - name: Instalando linter ruff
        run: pip install ruff

      - name: Executando o ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: linting
    permissions: read-all
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10','3.11','3.13']
    steps:
      - name: Upando repositorio
        uses: actions/checkout@v6.0.2

      - name: Configurando ambiente python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{matrix.python-version}}

      - name: Instalando o pytest
        run: pip install pytest

      - name: Rodando pytest
        run: pytest

      
 
  
   
  
        
    
        
