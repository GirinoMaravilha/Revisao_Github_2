# Estudando sobre workflow_dispatch

name: Estudando workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do projeto"
        required: true
        type: string
      environment:  
        description: "Escolha o ambiente"
        required: true
        type: environment
      run_tests:
        description: "Executar testes antes?"
        type: boolean
        default: true
      

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Verificando valor do input de ambiente
        run: echo "Estudando o workflow_dispatch com o valor de ambiente ${{inputs.environment}}"
      
      - name: Verificando se tem que fazer testes
        if: ${{inputs.run_tests}}
        run: echo "O input ativou a depuração do repositório com o pytest"
