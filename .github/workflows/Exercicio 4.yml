# Exercício 4
name: Realizando o exercício 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Upando o repositório
        uses: actions/checkout@v6.0.2
      
      - name: Configurando ambiente python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Baixando biblioteca build
        run: python3.13 -m pip install build

      - name: Gerando a build do projeto
        run: python3.13 -m build

      - name: Upando a build para o github
        uses: actions/upload-artifact@v6.0.0
        with:
          name: package
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: package
          path: package

      - run: echo 'Deploy pronto para semantic-release'
      
